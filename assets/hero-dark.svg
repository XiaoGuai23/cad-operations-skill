<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="100%" height="210">
  <defs>
    <linearGradient id="gearGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="cadGridD" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.9"/>
    </pattern>
  </defs>

  <!-- Dark CAD Workstation Backdrop -->
  <rect x="10" y="10" width="900" height="190" rx="20" fill="#0b1120" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="12" y="12" width="896" height="186" rx="19" fill="url(#cadGridD)" opacity="0.85"/>

  <!-- Corner CAD Registration Ticks -->
  <path d="M28 28 H52 M28 28 V52 M892 28 H868 M892 28 V52 M28 182 H52 M28 182 V158 M892 182 H868 M892 182 V158" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.55" fill="none"/>

  <!-- Custom CAD Precision Gear + Isometric B-Rep + Crosshair Emblem -->
  <g transform="translate(132, 105)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#f87171" stroke-width="1.3" stroke-dasharray="10 4 2.5 4" opacity="0.8"/>
    <line x1="-78" y1="0" x2="78" y2="0" stroke="#f87171" stroke-width="1.1" stroke-dasharray="10 4 2.5 4" opacity="0.65"/>
    <line x1="0" y1="-78" x2="0" y2="78" stroke="#f87171" stroke-width="1.1" stroke-dasharray="10 4 2.5 4" opacity="0.65"/>

    <g fill="url(#gearGradD)">
      <circle cx="0" cy="0" r="46"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(30)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(60)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(90)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(120)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(150)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(180)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(210)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(240)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(270)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(300)"/>
      <rect x="-8" y="-58" width="16" height="16" rx="2.5" transform="rotate(330)"/>
    </g>

    <circle cx="0" cy="0" r="32" fill="#0b1120"/>
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#0f172a"/>
    <polygon points="0,-24 21,-12 0,0 -21,-12" fill="#7dd3fc"/>
    <polygon points="0,0 21,-12 21,12 0,24" fill="#0284c7"/>
    <polygon points="0,0 -21,-12 -21,12 0,24" fill="#1e40af"/>

    <rect x="20" y="-56" width="44" height="36" rx="4" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="64" cy="-56" r="11" fill="#10b981"/>
    <polyline points="59,-56 62.8,-52.2 69.5,-59.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bold Brand Typography -->
  <g transform="translate(242, 92)">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">
      CAD Operations
    </text>
    <rect x="478" y="-44" width="128" height="50" rx="12" fill="url(#accentGradD)"/>
    <text x="542" y="-10" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="31" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      SKILL
    </text>

    <line x1="2" y1="22" x2="604" y2="22" stroke="#38bdf8" stroke-width="1.6"/>
    <polygon points="2,22 12,18.5 12,25.5" fill="#38bdf8"/>
    <polygon points="604,22 594,18.5 594,25.5" fill="#38bdf8"/>
    <rect x="228" y="12" width="150" height="20" rx="4" fill="#0b1120"/>
    <text x="303" y="26" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#38bdf8">
      2D · 3D · DIFF · MCP v2.2
    </text>

    <text x="2" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif" font-size="18.5" font-weight="600" fill="#cbd5e1">
      Deterministic 2D/3D CAD Drafting, Surgical Vector Revision &amp; Engineering Audit
    </text>
  </g>
</svg>
