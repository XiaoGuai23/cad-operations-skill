[project]
name = "cad-2d-skill"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ezdxf>=1.4,<1.5",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "python-docx>=1.2,<2",
  "pypdf>=6,<7",
  "Pillow>=10,<13",
  "matplotlib>=3.10,<4",
  "fonttools>=4,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
cad-skill = "cad_skill_core.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "autocad: read-only or explicitly opted-in AutoCAD 2023 integration probes"
]
